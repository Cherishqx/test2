[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --tb=short
markers =
    robustness: 鲁棒性测试用例（R01~R16）
    fairness: 公平性测试用例（F01~F08）
    security: 安全性测试用例（S01~S12）
    role_guard: 角色覆盖防护回归用例（G01~G09）
    gpu: 需要 CUDA GPU（加载真实 Qwen 模型）的用例
